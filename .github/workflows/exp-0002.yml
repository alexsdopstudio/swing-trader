name: EXP-0002

on:
  pull_request:
    branches: [main]
    paths:
      - "src/swing_trader/cost_sensitivity.py"
      - "src/swing_trader/cost_sensitivity_cli.py"
      - "src/swing_trader/experiment.py"
      - "src/swing_trader/execution.py"
      - "src/swing_trader/data.py"
      - "src/swing_trader/indicators.py"
      - "src/swing_trader/historical.py"
      - "src/swing_trader/portfolio.py"
      - "src/swing_trader/metrics.py"
      - "config/universe.yaml"
      - "config/execution-costs.yaml"
      - "experiments/EXP-0001-baseline/config.yaml"
      - "experiments/EXP-0001-baseline/results.json"
      - "experiments/EXP-0002-cost-sensitivity/config.yaml"
      - ".github/workflows/exp-0002.yml"

permissions:
  contents: read

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run EXP-0002
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artifacts/EXP-0002
          for attempt in 1 2 3; do
            if swing-cost-sensitivity \
              --config experiments/EXP-0002-cost-sensitivity/config.yaml \
              --output-dir .artifacts/EXP-0002; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "EXP-0002 failed after 3 attempts" >&2
              exit 1
            fi
            echo "EXP-0002 attempt $attempt failed; retrying after 10 seconds..." >&2
            sleep 10
          done

      - name: Validate generated artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.artifacts/EXP-0002')
          required = ['results.json', 'comparison.csv', 'resolved-config.yaml', 'notes.md']
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise SystemExit(f'Missing EXP-0002 artifacts: {missing}')

          results = json.loads((root / 'results.json').read_text(encoding='utf-8'))
          if results['experiment']['id'] != 'EXP-0002':
              raise SystemExit('Unexpected experiment id')

          expected = {'low', 'baseline', 'high', 'stress'}
          if set(results['scenarios']) != expected:
              raise SystemExit(f"Unexpected scenarios: {set(results['scenarios'])}")
          if results['scenarios']['baseline']['multiplier'] != 1.0:
              raise SystemExit('Baseline cost multiplier must be 1.0')
          if not results['data_consistency']['identical_source_digests_across_scenarios']:
              raise SystemExit('Sensitivity scenarios did not share identical market-data digests')

          for scenario in expected:
              scenario_root = root / 'scenarios' / scenario
              for name in ['results.json', 'trades.csv', 'equity.csv', 'resolved-config.yaml']:
                  if not (scenario_root / name).exists():
                      raise SystemExit(f'Missing {scenario}/{name}')

          source = results['data_coverage']['source']
          if not source or any('sha256' not in record for record in source.values()):
              raise SystemExit('Source-data digests are missing')
          PY

      - name: Upload EXP-0002 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXP-0002-cost-sensitivity
          path: .artifacts/EXP-0002
          if-no-files-found: error
          retention-days: 30
