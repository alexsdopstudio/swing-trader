name: Project dashboard

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - "src/swing_trader/project_dashboard.py"
      - "src/swing_trader/project_dashboard_cli.py"
      - "tests/test_project_dashboard.py"
      - "experiments/registry.json"
      - "knowledge/registry.json"
      - "config/universe.yaml"
      - "pyproject.toml"
      - ".github/workflows/project-dashboard.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "src/swing_trader/project_dashboard.py"
      - "src/swing_trader/project_dashboard_cli.py"
      - "tests/test_project_dashboard.py"
      - "experiments/registry.json"
      - "knowledge/registry.json"
      - "config/universe.yaml"
      - "pyproject.toml"
      - ".github/workflows/project-dashboard.yml"
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:

concurrency:
  group: project-dashboard-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate dashboard
        run: pytest -q tests/test_project_dashboard.py

      - name: Build dashboard
        run: |
          swing-dashboard-build \
            --root . \
            --output-dir .artifacts/project-dashboard/site

      - name: Validate canonical status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          site = Path('.artifacts/project-dashboard/site')
          required = {'index.html', 'styles.css', 'app.js', 'project.json'}
          actual = {path.name for path in site.iterdir() if path.is_file()}
          if actual != required:
              raise SystemExit(f'Unexpected dashboard file set: {sorted(actual)}')
          project = json.loads((site / 'project.json').read_text(encoding='utf-8'))
          strategy = project['strategy']
          if strategy['validation_status'] != 'not_validated':
              raise SystemExit('Dashboard must remain NOT VALIDATED')
          if strategy['deployment_status'] != 'research_only':
              raise SystemExit('Dashboard must remain research-only')
          PY

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-dashboard-site
          path: .artifacts/project-dashboard/site
          if-no-files-found: error
          retention-days: 14

  pages-artifact:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout main event revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build dashboard
        run: |
          swing-dashboard-build \
            --root . \
            --output-dir .artifacts/project-dashboard/site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .artifacts/project-dashboard/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: pages-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
