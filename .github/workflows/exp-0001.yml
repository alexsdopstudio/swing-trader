name: EXP-0001

on:
  pull_request:
    branches: [main]
    paths:
      - "src/swing_trader/experiment.py"
      - "src/swing_trader/experiment_cli.py"
      - "src/swing_trader/data.py"
      - "src/swing_trader/indicators.py"
      - "src/swing_trader/historical.py"
      - "src/swing_trader/portfolio.py"
      - "src/swing_trader/metrics.py"
      - "src/swing_trader/execution.py"
      - "config/universe.yaml"
      - "config/execution-costs.yaml"
      - "experiments/EXP-0001-baseline/config.yaml"
      - ".github/workflows/exp-0001.yml"

permissions:
  contents: read

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run EXP-0001
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artifacts/EXP-0001
          for attempt in 1 2 3; do
            if python -m swing_trader.experiment_cli \
              --config experiments/EXP-0001-baseline/config.yaml \
              --output-dir .artifacts/EXP-0001; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "EXP-0001 failed after 3 attempts" >&2
              exit 1
            fi
            echo "EXP-0001 attempt $attempt failed; retrying after 10 seconds..." >&2
            sleep 10
          done

      - name: Validate generated artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.artifacts/EXP-0001')
          required = ['results.json', 'trades.csv', 'equity.csv', 'resolved-config.yaml', 'notes.md']
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise SystemExit(f'Missing experiment artifacts: {missing}')

          results = json.loads((root / 'results.json').read_text(encoding='utf-8'))
          if results['experiment']['id'] != 'EXP-0001':
              raise SystemExit('Unexpected experiment id')
          if results['diagnostics']['trade_count'] <= 0:
              raise SystemExit('EXP-0001 produced no trades; inspect data/strategy before accepting run')

          expected = {'BTC-USD', 'SOL-USD', 'META', 'NVDA'}
          coverage = set(results['data_coverage']['evaluation'])
          if coverage != expected:
              raise SystemExit(f'Unexpected evaluation coverage: {coverage}')
          PY

      - name: Upload EXP-0001 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXP-0001-baseline
          path: .artifacts/EXP-0001
          if-no-files-found: error
          retention-days: 30
