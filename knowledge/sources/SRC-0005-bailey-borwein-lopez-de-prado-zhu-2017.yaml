project_relevance: >-
  Provides a framework for reasoning about the probability that a selected investment backtest is
  overfit after comparing alternatives, reinforcing the project's policy of not promoting the best
  retrospective parameter set and of reserving future data for preregistered evaluation.
limitations:
  - The proposed probability-of-backtest-overfitting framework is a diagnostic methodology, not proof that a strategy is robust when its estimate is favorable.
  - Swing Trader currently emphasizes preregistration, neighborhood tests, and prospective replay rather than implementing the paper's full CSCV procedure.
