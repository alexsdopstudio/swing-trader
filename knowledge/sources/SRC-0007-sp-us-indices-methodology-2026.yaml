project_relevance: >-
  Documents eligibility, maintenance, additions, and deletions for major U.S. equity indices. The
  changing constituent process supports using point-in-time membership for historical universe tests
  instead of applying today's index members to earlier dates.
limitations:
  - Current methodology does not by itself reconstruct the exact historical membership state for every past date.
  - Swing Trader's configured universe is not currently defined as an S&P index, so this source informs methodology rather than membership selection directly.
