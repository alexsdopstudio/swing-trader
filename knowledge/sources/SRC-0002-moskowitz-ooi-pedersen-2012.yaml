project_relevance: >-
  Documents return continuation over intermediate horizons across a broad set of liquid futures,
  supporting time-series trend/momentum as a research concept across asset classes rather than only
  as an equity cross-sectional effect.
limitations:
  - The instruments are futures across equity indices, currencies, commodities, and bonds rather than this project's spot crypto and individual equities.
  - The paper's signals, portfolio construction, leverage, and horizon differ from Swing Trader v1 and cannot validate its score or thresholds.
