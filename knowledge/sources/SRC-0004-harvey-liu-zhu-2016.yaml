project_relevance: >-
  Shows why conventional significance thresholds become less persuasive after extensive factor and
  strategy searching, reinforcing the need to record how many hypotheses and parameter variants were
  considered rather than presenting only the surviving result.
limitations:
  - The paper focuses on the cross-section of expected returns and published factor research, not this project's exact event-driven strategy.
  - Statistical significance controls do not replace execution realism, economic relevance, or prospective validation.
