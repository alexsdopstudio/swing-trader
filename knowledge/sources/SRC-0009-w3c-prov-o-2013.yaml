project_relevance: >-
  Provides an authoritative provenance model built around entities, activities, agents, derivation,
  attribution, and time. Swing Trader uses the same design principle to keep sources, observations,
  generated indexes, and curated interpretation traceable without claiming formal PROV-O conformance.
limitations:
  - PROV-O is a general Web provenance ontology, not a trading-research or AI-agent knowledge-base specification.
  - The repository does not currently serialize its records as RDF/OWL or claim standards conformance.
