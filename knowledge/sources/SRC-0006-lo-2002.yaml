project_relevance: >-
  Demonstrates that Sharpe-ratio estimates have sampling uncertainty and that simple square-root-time
  annualization depends on return assumptions, supporting cautious interpretation of backtest Sharpe
  values rather than treating them as exact strategy properties.
limitations:
  - The paper does not define a single universally correct performance metric for all trading strategies.
  - It does not validate this repository's returns; it motivates diagnostics around dependence, sample size, and metric uncertainty.
