project_relevance: >-
  Formalizes the inference problem created when the same historical data are reused for model
  selection and evaluation, directly supporting the repository's separation of exploratory
  diagnostics from preregistered prospective validation.
limitations:
  - The paper provides statistical methodology rather than a guarantee that any particular anti-overfitting workflow is sufficient.
  - Applying the general lesson still requires project-specific controls, frozen decisions, and genuinely future evidence.
