project_relevance: >-
  Provides foundational evidence that relative past winners and losers in equities exhibited
  intermediate-horizon return continuation, making momentum a legitimate research hypothesis rather
  than a rule invented from this repository's backtest.
limitations:
  - The study is cross-sectional and uses winner-minus-loser portfolios, unlike Swing Trader v1's long-only daily score.
  - Its historical sample, assets, portfolio construction, and costs do not validate this repository's implementation.
